            - paragraph [ref=f1e290]: "Playwright MCP supports three profile modes:"
            - list [ref=f1e291]:
              - listitem [ref=f1e292]:
                - strong [ref=f1e293]: Persistent (default)
                - text: ": Login state and cookies are preserved between sessions. The profile is stored in"
                - code [ref=f1e294]: "ms-playwright/mcp-{channel}-{workspace-hash}"
                - text: in your platform's cache directory, so different projects get separate profiles automatically. Override with
                - code [ref=f1e295]: "--user-data-dir"
                - text: .
              - listitem [ref=f1e296]:
                - strong [ref=f1e297]: Isolated
                - text: ": Each session starts fresh. Pass"
                - code [ref=f1e298]: "--isolated"
                - text: to enable. You can load initial state with
                - code [ref=f1e299]: "--storage-state"
                - text: .
              - listitem [ref=f1e300]:
                - strong [ref=f1e301]: Browser extension
                - text: ": Connect to your existing browser tabs with the"
                - link "Playwright Extension" [ref=f1e302] [cursor=pointer]:
                  - /url: https://github.com/microsoft/playwright/blob/main/packages/extension/README.md
                - text: . Pass
                - code [ref=f1e303]: "--extension"
                - text: to enable.
