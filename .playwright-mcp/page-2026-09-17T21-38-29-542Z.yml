                - text: "#"
            - paragraph [ref=f1e323]: "When running a headed browser on a system without a display or from IDE worker processes, start the MCP server separately with HTTP transport:"
            - generic [ref=f1e325]:
              - code [ref=f1e327]:
                - generic [ref=f1e328]: npx @playwright/mcp@latest --port 8931
              - button "Copy code to clipboard" [ref=f1e330] [cursor=pointer]
            - paragraph [ref=f1e336]:
              - text: HTTP sessions use a five-second heartbeat timeout. If your MCP client or proxy does not answer server-initiated pings, set
              - code [ref=f1e337]: PLAYWRIGHT_MCP_PING_TIMEOUT_MS
              - text: to a longer timeout in milliseconds. Set it to
              - code [ref=f1e338]: "0"
              - text: to disable the heartbeat.
            - paragraph [ref=f1e339]: "Then point your MCP client to the HTTP endpoint:"
