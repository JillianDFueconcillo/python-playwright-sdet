            - paragraph [ref=f1e137]: "Once the server is connected, ask your AI assistant to interact with a web page:"
            - generic [ref=f1e139]:
              - code [ref=f1e141]:
                - generic [ref=f1e142]: Navigate to https://demo.playwright.dev/todomvc and add a few todo items.
              - button "Copy code to clipboard" [ref=f1e144] [cursor=pointer]
            - paragraph [ref=f1e150]: The assistant will use Playwright MCP tools to open the browser, navigate to the page, and interact with elements — all through structured accessibility snapshots rather than screenshots.
            - heading [level=2] [ref=f1e151]:
              - text: Core Features
              - link "Direct link to Core Features" [ref=f1e152] [cursor=pointer]:
                - /url: "#core-features"
                - text: "#"
            - heading [level=3] [ref=f1e153]:
              - text: Accessibility snapshots
              - link "Direct link to Accessibility snapshots" [ref=f1e154] [cursor=pointer]:
                - /url: "#accessibility-snapshots"
                - text: "#"
            - paragraph [ref=f1e155]: "Playwright MCP operates on the page's accessibility tree, not pixels. When a tool runs, it returns a structured snapshot showing the page elements, their roles, and text content. The LLM uses element references from these snapshots to interact with the page:"
            - generic [ref=f1e157]:
              - code [ref=f1e159]:
                - generic [ref=f1e160]: "- heading \"todos\" [level=1]"
                - generic [ref=f1e161]: "- textbox \"What needs to be done?\" [ref=e5]"
                - generic [ref=f1e162]: "- listitem:"
                - generic [ref=f1e163]: "- checkbox \"Toggle Todo\" [ref=e10]"
                - generic [ref=f1e164]: "- text: \"Buy groceries\""
              - button "Copy code to clipboard" [ref=f1e166] [cursor=pointer]
            - paragraph [ref=f1e172]:
              - text: The LLM reads this snapshot and uses
              - code [ref=f1e173]: ref=e5
              - text: to type into the textbox or
              - code [ref=f1e174]: ref=e10
              - text: to check the checkbox.
            - heading [level=3] [ref=f1e175]:
              - text: Interacting with pages
              - link "Direct link to Interacting with pages" [ref=f1e176] [cursor=pointer]:
                - /url: "#interacting-with-pages"
                - text: "#"
            - paragraph [ref=f1e177]: "Playwright MCP provides tools for all common browser interactions:"
            - list [ref=f1e178]:
              - listitem [ref=f1e179]:
                - strong [ref=f1e180]: Navigation
                - text: ": Open URLs, go back/forward, reload pages."
              - listitem [ref=f1e181]:
                - strong [ref=f1e182]: Clicking and typing
                - text: ": Click elements, type text, fill forms, select dropdowns."
              - listitem [ref=f1e183]:
                - strong [ref=f1e184]: Screenshots
                - text: ": Capture the current page or specific elements for visual verification."
              - listitem [ref=f1e185]:
                - strong [ref=f1e186]: Keyboard and mouse
                - text: ": Press keys, hover, drag and drop."
              - listitem [ref=f1e187]:
                - strong [ref=f1e188]: Dialogs
                - text: ": Accept or dismiss browser dialogs."
              - listitem [ref=f1e189]:
                - strong [ref=f1e190]: Tabs
                - text: ": Create, close, and switch between browser tabs."
            - heading [level=3] [ref=f1e191]:
              - text: Running Playwright code
              - link "Direct link to Running Playwright code" [ref=f1e192] [cursor=pointer]:
                - /url: "#running-playwright-code"
                - text: "#"
            - paragraph [ref=f1e193]:
              - text: For complex interactions that go beyond individual tool calls, use the
              - code [ref=f1e194]: browser_run_code_unsafe
              - text: "tool to execute Playwright scripts directly. This tool runs arbitrary JavaScript in the Playwright server process and is RCE-equivalent — only enable it for trusted MCP clients:"
            - generic [ref=f1e196]:
              - code [ref=f1e198]:
                - generic [ref=f1e199]: "Run this Playwright code to verify the todo count:"
                - generic [ref=f1e200]: "async (page) => {"
                - generic [ref=f1e201]: const count = await page.getByTestId('todo-count').textContent();
                - generic [ref=f1e202]: return count;
                - generic [ref=f1e203]: "}"
              - button "Copy code to clipboard" [ref=f1e205] [cursor=pointer]
            - heading [level=3] [ref=f1e211]:
              - text: Network monitoring and mocking
              - link "Direct link to Network monitoring and mocking" [ref=f1e212] [cursor=pointer]:
                - /url: "#network-monitoring-and-mocking"
                - text: "#"
            - paragraph [ref=f1e213]: "Inspect network traffic and mock API responses:"
            - list [ref=f1e214]:
              - listitem [ref=f1e215]:
                - strong [ref=f1e216]: View network requests
                - text: ": List all requests made since page load."
              - listitem [ref=f1e217]:
                - strong [ref=f1e218]: Mock routes
                - text: ": Set up URL pattern matching to return custom responses."
              - listitem [ref=f1e219]:
                - strong [ref=f1e220]: Console messages
                - text: ": Access browser console output for debugging."
            - heading [level=3] [ref=f1e221]:
