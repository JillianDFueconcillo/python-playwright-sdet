                - text: "#"
            - paragraph [ref=f1e134]: The standard configuration works with most MCP clients, including Windsurf, Cline, Goose, Kiro, Codex, Copilot CLI, and others. Consult your client's MCP documentation for where to place the config.
            - heading [level=3] [ref=f1e135]:
